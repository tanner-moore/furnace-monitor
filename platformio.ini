; Furnace monitor firmware for the KinCony CO16 (ESP32-S3-WROOM-1U N16R8).
; Monitor only: the CO16 relays are forced off at boot and never touched again.

[platformio]
default_envs = co16

[env:co16]
; pioarduino tracks the Arduino-ESP32 3.x core (needed for W5500 Ethernet).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    ; Pinned to GitHub tags so builds are reproducible.
    https://github.com/adafruit/Adafruit_BusIO.git#1.17.0
    https://github.com/adafruit/Adafruit_MAX31865.git#1.6.2
    https://github.com/adafruit/Adafruit_ADS1X15.git#2.5.0
    https://github.com/bblanchon/ArduinoJson.git#v7.2.1
    https://github.com/knolleary/pubsubclient.git#v2.8
    https://github.com/ESP32Async/AsyncTCP.git#v3.3.8
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.6.2
    https://github.com/adafruit/Adafruit-GFX-Library.git#1.12.1

; Host-side unit tests for the furnace model and LED decoder (no hardware needed).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
